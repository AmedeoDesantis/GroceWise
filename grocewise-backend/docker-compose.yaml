version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: grocewise_mongo
    ports:
      - "27017:27017"
    environment:
      # Docker Compose legge automaticamente il file .env nella stessa cartella
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: